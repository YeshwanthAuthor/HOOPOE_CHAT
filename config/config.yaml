company_name: "Meridian Softworks Pvt. Ltd."

llm:
  provider: "openai"                 # "openai" or "gemini"
  openai_model: "gpt-4o-mini"
  gemini_model: "gemini-2.5-flash"

embedding:
  provider: "openai"                 # "openai" or "gemini"
  openai_model: "text-embedding-3-small"
  gemini_model: "models/embedding-001"

vector_store:
  type: "faiss"
  base_path: "vectorstores"
  index_name: "index"

chunking:
  chunk_size: 1000
  chunk_overlap: 200

retrieval:
  hybrid_enabled: true
  vector_weight: 0.6
  bm25_weight: 0.4
  decompose_compound_questions: true   # split multi-topic questions and retrieve each topic separately - see rag_chain.split_into_subquestions

reranking:
  enabled: true
  initial_k: 30
  final_k: 5
  method: "cross-encoder"
  cross_encoder_model: "cross-encoder/ms-marco-MiniLM-L6-v2"
  max_chunk_chars: 1200
  min_relevance_score: -2.0

prompt:
  system_prompt: >
    You are Hoopoe, a professional and thoughtful assistant. Use the uploaded
    documents as your primary source of truth. Cite every fact you use with
    the bracket number of the chunk it came from, like [1] or [2]. If the
    documents do not contain enough information, say so clearly instead of
    guessing.
  temperature: 0.1
  max_tokens: 900

memory:
  enabled_default: true
  max_recent_turns: 5

upload:
  allowed_extensions: [".pdf", ".docx", ".txt"]
  max_size_mb: 2

logging:
  level: "INFO"
  log_file: "logs/hoopoe.log"
